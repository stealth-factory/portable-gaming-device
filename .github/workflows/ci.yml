# Typecheck, unit tests and build on every pull request and every push to
# main, so the release PR is never the first place a broken build shows up.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The App Store Connect helpers testflight.yml runs; no dependencies.
      - run: node --test '.github/scripts/*.test.mjs'
      # `build` runs `tsc --noEmit` first.
      - run: npm run build
      # The disk files and catalogue the build just wrote (GAM-34): signature, sizes and hashes.
      - run: node tools/disks/verify.mjs

  # The native engine core (native/core, GAM-35): C++17 with no dependencies, built and tested on Linux
  # with both compilers so it stays portable to the iOS and Android toolchains.
  native-core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: cmake -S native/core -B build/core -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
        env:
          CXX: ${{ matrix.cxx }}
      - run: cmake --build build/core --parallel
      - run: ctest --test-dir build/core --output-on-failure
      # Every disk file played in the native script host (QuickJS, GAM-36) must give the same conformance stream as
      # Node gives it, byte for byte.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/disks/build.mjs --out build/disks
      - run: node tools/conformance/native-check.mjs build/disks build/core/pgd_disk_run
