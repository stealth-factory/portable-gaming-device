# Typecheck, unit tests and build on every pull request and every push to
# main, so the release PR is never the first place a broken build shows up.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The App Store Connect helpers testflight.yml runs; no dependencies.
      - run: node --test '.github/scripts/*.test.mjs'
      # `build` runs `tsc --noEmit` first.
      - run: npm run build
