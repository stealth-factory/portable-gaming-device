# Releases once the release pull request is merged.
#
# release-pr.yml prepares; this fires when that preparation lands on main.
# It tags the commit, publishes a GitHub Release with the changelog entry,
# and fast-forwards the `production` branch to it. Vercel's production
# branch is `production`, so that push is the production deploy. Every
# other push to main is a preview.
#
# It fires on any push to main and does nothing unless the version in
# package.json has no tag yet, so re-running it is harmless.
name: tag-release

on:
  push:
    branches: [main]
  # To finish a release whose run failed part-way.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  release:
    # Only main is ever released, including from a manual run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      # The release GitHub App, when configured (RELEASE_APP_CLIENT_ID
      # variable + RELEASE_APP_PRIVATE_KEY secret), as in release-pr.yml.
      # Pushing as the App lets the production branch's ruleset name it as
      # a bypass actor; GITHUB_TOKEN cannot be one. Nothing runs on pushes
      # to production or on tags, so pushing as the App starts no workflow.
      - name: Mint the release app token
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # The tag and the production push go out as the App when it is
          # configured, otherwise as github-actions[bot].
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Tag it, if this version has not been tagged
        id: tag
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if ! printf '%s\n' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json version '${version}' is not X.Y.Z" >&2; exit 1
          fi
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} exists; nothing to tag"
            exit 0
          fi
          # Tag the commit that brought this version to main (the merged
          # release PR), not whatever is at HEAD. Runs share one concurrency
          # group, and GitHub replaces a pending run with a newer one, so
          # this run may be for a later push whose changes were never in
          # the release PR. The very first tag has no release PR behind it:
          # it is the baseline, and goes on HEAD.
          if git tag -l 'v[0-9]*' | grep -q .; then
            sha=$(git log -n 1 --first-parent --format=%H \
              -S"\"version\": \"${version}\"" HEAD -- package.json)
            if [ -z "$sha" ]; then
              echo "no commit on main introduced version ${version}" >&2
              exit 1
            fi
          else
            sha=$(git rev-parse HEAD)
            echo "no tags yet: ${tag} is the baseline"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, so the tag carries who made it and when.
          git tag -a "$tag" -m "$tag" "$sha"
          git push origin "$tag"
          echo "pushed ${tag} at ${sha}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "${TAG} already has a release"
            exit 0
          fi
          # This version's section of the changelog, without its heading.
          awk -v h="## [${VERSION}]" \
            'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' \
            CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "See CHANGELOG.md." > /tmp/notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file /tmp/notes.md

      - name: Promote production to the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-list -n 1 "$TAG")
          # The tag must be on main: nothing reaches production that main
          # has not had.
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "${TAG} (${sha}) is not on main; refusing to promote" >&2
            exit 1; }
          if git rev-parse -q --verify refs/remotes/origin/production >/dev/null; then
            current=$(git rev-parse origin/production)
            if [ "$current" = "$sha" ]; then
              echo "production is already at ${TAG}"
              exit 0
            fi
            # An older tag re-run must not roll production backwards.
            if git merge-base --is-ancestor "$sha" "$current"; then
              echo "production is already past ${TAG}"
              exit 0
            fi
            # Fast-forward when we can. If production holds commits main does
            # not (a PR merged straight into production, as Vercel's bot did
            # with #86), move it only when the tag already contains every one
            # of their changes: merging production into the tag must change
            # nothing. Then nothing is lost. Anything else is a divergence
            # for a person to look at, not something to force past.
            lease=""
            if ! git merge-base --is-ancestor "$current" "$sha"; then
              extra=$(git log --oneline "${sha}..${current}")
              merged=$(git merge-tree --write-tree "$sha" "$current" 2>/dev/null) || merged=""
              if [ "$merged" != "$(git rev-parse "${sha}^{tree}")" ]; then
                echo "production (${current}) is not an ancestor of ${TAG}" >&2
                echo "and holds changes ${TAG} does not have:" >&2
                printf '%s\n' "$extra" >&2
                echo "land them on main first; see docs/releasing.md" >&2
                exit 1
              fi
              echo "production holds commits main does not, all already in ${TAG}:"
              printf '%s\n' "$extra"
              lease="--force-with-lease=refs/heads/production:${current}"
            fi
          fi
          git push $lease origin "${sha}:refs/heads/production"
          echo "production -> ${TAG} (${sha}); Vercel deploys it"
